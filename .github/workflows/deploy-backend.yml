name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app.cgi'
      - 'config.py'
      - 'requirements.txt'
      - 'runtime.txt'
      - 'server_local.py'
      - 'server.py'
      - 'passenger_wsgi.py'
      - 'ensure_local.py'
      - 'wsgi.py'
      - 'run.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify backend compiles
        run: |
          python -m py_compile app.cgi config.py server_local.py passenger_wsgi.py wsgi.py run.py
          python -m compileall -q app

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy backend to cPanel via FTPS (lftp, upload-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BACKEND_PATH: ${{ secrets.FTP_BACKEND_PATH }}
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 8;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' ftp://$FTP_SERVER;
            mirror -R --no-perms --parallel=2 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .venv/ \
              --exclude-glob venv/ \
              --exclude-glob node_modules/ \
              --exclude-glob __pycache__/ \
              --exclude-glob '*.pyc' \
              --exclude-glob logs/ \
              --exclude-glob instance/ \
              --exclude-glob backups/ \
              --exclude-glob tmp/ \
              --exclude-glob public/ \
              --exclude-glob uploads/ \
              --exclude-glob wheelhouse/ \
              --exclude-glob 'wheelhouse.tar.gz' \
              --exclude-glob 'edysync/' \
              --exclude-glob 'railway_deploy/' \
              --exclude-glob 'docs/' \
              --exclude-glob 'PRPs/' \
              --exclude-glob 'features/' \
              --exclude-glob 'tests/' \
              --exclude-glob '.env*' \
              --exclude-glob '._*' \
              --exclude-glob '.dockerignore' \
              --exclude-glob 'deps_ready.txt' \
              --exclude-glob 'migrations/versions/*.pyc' \
              ./ '$FTP_BACKEND_PATH';
            quit;
          "

      - name: Restart backend (recarga codigo nuevo)
        run: |
          code=$(curl -s -o /tmp/restart.json -w "%{http_code}" -X POST \
            -H "X-Restart-Secret: ${{ secrets.RESTART_SECRET }}" \
            -H "Origin: https://moscowle.centrojuanpabloii.com" \
            "https://backend.centrojuanpabloii.com/api/server/restart?force=1")
          echo "HTTP $code"
          cat /tmp/restart.json
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::Restart fallo ($code). Revisa logs del servidor."
            exit 1
          fi

      - name: Smoke test API
        run: |
          sleep 2
          curl -sS "https://backend.centrojuanpabloii.com/api/health" -w "\nHTTP %{http_code}\n"
