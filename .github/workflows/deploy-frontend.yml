name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'edysync/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edysync

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edysync/package-lock.json

      - name: Cache Angular build
        uses: actions/cache@v4
        with:
          path: edysync/.angular/cache
          key: angular-cache-${{ runner.os }}-${{ hashFiles('edysync/package-lock.json') }}

      - run: npm ci
      - run: npm run build

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: edysync/dist/edysync/
          server-dir: ${{ secrets.FTP_PATH }}
          dangerous-clean-slate: true
