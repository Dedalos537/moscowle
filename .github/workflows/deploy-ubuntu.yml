name: Deploy to Ubuntu (auto)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-deploy:
    name: Trigger backend deploy (git pull + restart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify webhook (backend)
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -F "backend=true" \
            -o /tmp/deploy_backend_resp.json -w "HTTP %{http_code}\n"
          cat /tmp/deploy_backend_resp.json
          echo ""

  frontend-deploy:
    name: Build frontend + send dist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edysync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edysync/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Package dist
        run: |
          tar -czf /tmp/frontend_dist.tar.gz -C dist/edysync/browser .

      - name: Send dist to webhook (frontend)
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -F "frontend=@/tmp/frontend_dist.tar.gz" \
            -o /tmp/deploy_frontend_resp.json -w "HTTP %{http_code}\n"
          cat /tmp/deploy_frontend_resp.json
          echo ""

  verify:
    name: Smoke test endpoints
    runs-on: ubuntu-latest
    needs: [backend-deploy, frontend-deploy]
    steps:
      - name: Wait for deploy
        run: sleep 15
      - name: Check backend health
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://api-centrojuanpabloii.online/api/health")
          echo "API health HTTP $code"
          cat /tmp/health.json; echo ""
          test "$code" = "200"
      - name: Check frontend /app/
        run: |
          code=$(curl -s -o /tmp/app.html -w "%{http_code}" "https://api-centrojuanpabloii.online/app/")
          echo "Frontend /app/ HTTP $code"
          grep -q '<base href="/app/">' /tmp/app.html
          grep -q 'guardian_name' /tmp/app.html || true
          test "$code" = "200"
