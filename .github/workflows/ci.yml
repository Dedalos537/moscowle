name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          # Fijado al mismo ruff que .pre-commit-config.yaml (v0.15.16)
          pip install ruff==0.15.16
          ruff check app/ --select E,F,W --ignore E501

      - name: Run tests
        env:
          FLASK_APP: wsgi:app
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret
          DATABASE_URL: sqlite:///test.db
        run: |
          python -m pytest tests/ -v --tb=short -x

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edysync

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edysync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      # Copia para cPanel: ahí la app cuelga de la raíz, así que solo cambia el <base href>.
      # scripts/deploy_cpanel.py --from-ci la descarga y la sube sin compilar en la máquina local.
      - name: Prepare cPanel bundle
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf ../frontend-cpanel && cp -r dist/edysync/browser ../frontend-cpanel
          sed -i 's#<base href="/app/">#<base href="/">#' ../frontend-cpanel/index.html
          grep -q '<base href="/">' ../frontend-cpanel/index.html

      - name: Upload cPanel bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cpanel
          path: frontend-cpanel
          retention-days: 14

  # Landing pública (centrojuanpabloii.com): React + three.js, aparte de la app Angular.
  # Se compila dos veces: para la raíz del dominio y para la vista previa en /nuevo/.
  # scripts/deploy_landing.py --from-ci descarga el artefacto y lo sube por FTP.
  landing-build:
    name: Landing Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (raíz y vista previa)
        run: |
          LANDING_BASE=/ npm run build && mv dist ../landing-root
          LANDING_BASE=/nuevo/ npm run build && mv dist ../landing-preview

      - name: Upload landing bundles
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: landing-cpanel
          path: |
            landing-root
            landing-preview
          retention-days: 14
