<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EdySync</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>
<body>
  <app-root>
    <style>
      .init-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #F8F6F0;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .init-splash__inner { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
      .init-splash__logo { animation: pulse-logo 1.5s ease-in-out infinite; }
      .init-splash__title {
        font-size: 1.5rem; font-weight: 800; color: #0A6E5E; margin: 0; text-align: center;
      }
      .init-splash__subtitle {
        font-size: 0.875rem; font-weight: 600; color: #6B7280;
        text-transform: uppercase; letter-spacing: 0.05em; margin: -0.5rem 0 1rem 0; text-align: center;
      }
      .init-splash__bar {
        width: 200px; height: 4px; border-radius: 2px;
        background: #E5E7EB; overflow: hidden;
      }
      .init-splash__bar-fill {
        height: 100%; border-radius: 2px; background: #0A6E5E;
        animation: load-bar 1.8s ease-in-out forwards;
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes load-bar {
        0% { width: 0%; }
        40% { width: 55%; }
        80% { width: 78%; }
        100% { width: 85%; }
      }
    </style>
    <div class="init-splash" id="initSplash">
      <div class="init-splash__inner">
        <div class="init-splash__logo">
          <img src="assets/img/logo.svg" alt="Centro Juan Pablo II" width="80" height="80" style="object-fit:contain;">
        </div>
        <h1 class="init-splash__title">Juan Pablo II</h1>
        <p class="init-splash__subtitle">Centro de Terapias</p>
        <div class="init-splash__bar">
          <div class="init-splash__bar-fill"></div>
        </div>
      </div>
    </div>
  </app-root>
  <script>
    (function () {
      var removed = false;
      function removeInitSplash() {
        if (removed) return;
        var el = document.getElementById('initSplash');
        if (el) {
          el.remove();
          removed = true;
        }
      }
      function booted() {
        return !!document.querySelector('#email, router-outlet, app-splash-screen');
      }
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.querySelector('app-root');
        if (root) {
          var obs = new MutationObserver(function () {
            if (booted()) {
              removeInitSplash();
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true, subtree: true });
        }
        setTimeout(removeInitSplash, 2500);
        setTimeout(function () {
          if (!booted()) {
            var key = 'edysync_boot_retry';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              location.reload();
            }
          }
        }, 8000);
      });
    })();
  </script>
</body>
</html>
