<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Centro Juan Pablo II</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>
<body>
  <script>
    // Tema y color de marca guardados, antes de que cargue Angular: el splash estático usa los mismos colores
    // que el de la app (presets de GlobalSettingsService; la tinta es la de mejor contraste).
    try {
      var dark = localStorage.getItem('theme') === 'dark';
      if (dark) document.documentElement.classList.add('dark');
      var presets = { green: ['#75a83a', '#a5d087'], blue: ['#2196F3', '#64B5F6'], purple: ['#9C27B0', '#CE93D8'],
        rose: ['#E91E63', '#F48FB1'], orange: ['#FF9800', '#FFB74D'], teal: ['#00BCD4', '#4DD0E1'] };
      var pick = presets[localStorage.getItem('edysync_primary_color')] || presets.green;
      var lum = function (h) { return [1, 3, 5].map(function (i) { var v = parseInt(h.slice(i, i + 2), 16) / 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce(function (a, v, i) { return a + v * [0.2126, 0.7152, 0.0722][i]; }, 0); };
      var root = document.documentElement.style;
      if (dark) {
        root.setProperty('--init-bg', 'color-mix(in srgb, ' + pick[1] + ' 26%, #0b0c0b)');
        root.setProperty('--init-ink', pick[1]);
      } else {
        var l = lum(pick[0]);
        root.setProperty('--init-bg', pick[0]);
        root.setProperty('--init-ink', 1.05 / (l + 0.05) >= (l + 0.05) / (lum('#121a0a') + 0.05) ? '#ffffff' : '#121a0a');
      }
    } catch (e) {}
  </script>
  <app-root>
    <style>
      .init-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: grid; place-items: center;
        background: var(--init-bg, #75a83a);
      }
      .init-splash__logo {
        width: 7rem; aspect-ratio: 1154 / 1106; background: var(--init-ink, #121a0a);
        -webkit-mask: url(assets/img/logo.svg) center / contain no-repeat;
        mask: url(assets/img/logo.svg) center / contain no-repeat;
        animation: init-breathe 1.6s ease-in-out infinite;
      }
      @keyframes init-breathe { 50% { transform: scale(0.96); } }
      @media (prefers-reduced-motion: reduce) { .init-splash__logo { animation: none; } }
    </style>
    <div class="init-splash" id="initSplash" role="status" aria-label="Cargando Centro Juan Pablo II">
      <span class="init-splash__logo" aria-hidden="true"></span>
    </div>
  </app-root>
  <script>
    (function () {
      var removed = false;
      function removeInitSplash() {
        if (removed) return;
        var el = document.getElementById('initSplash');
        if (el) {
          el.remove();
          removed = true;
        }
      }
      function booted() {
        return !!document.querySelector('#email, router-outlet, app-splash-screen');
      }
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.querySelector('app-root');
        if (root) {
          var obs = new MutationObserver(function () {
            if (booted()) {
              removeInitSplash();
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true, subtree: true });
        }
        setTimeout(removeInitSplash, 2500);
        setTimeout(function () {
          if (!booted()) {
            var key = 'edysync_boot_retry';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              location.reload();
            }
          }
        }, 8000);
      });
    })();
  </script>
</body>
</html>
