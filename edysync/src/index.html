<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Centro Juan Pablo II</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>
<body>
  <script>
    // Tema guardado antes de que cargue Angular: el splash estático usa los mismos colores que el de la app.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <app-root>
    <style>
      .init-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: grid; place-items: center;
        background: #75a83a;
      }
      .dark .init-splash { background: #1e2d12; }
      .init-splash__logo {
        width: 7rem; aspect-ratio: 1154 / 1106; background: #121a0a;
        -webkit-mask: url(assets/img/logo.svg) center / contain no-repeat;
        mask: url(assets/img/logo.svg) center / contain no-repeat;
        animation: init-breathe 1.6s ease-in-out infinite;
      }
      .dark .init-splash__logo { background: #a5d087; }
      @keyframes init-breathe { 50% { transform: scale(0.96); } }
      @media (prefers-reduced-motion: reduce) { .init-splash__logo { animation: none; } }
    </style>
    <div class="init-splash" id="initSplash" role="status" aria-label="Cargando Centro Juan Pablo II">
      <span class="init-splash__logo" aria-hidden="true"></span>
    </div>
  </app-root>
  <script>
    (function () {
      var removed = false;
      function removeInitSplash() {
        if (removed) return;
        var el = document.getElementById('initSplash');
        if (el) {
          el.remove();
          removed = true;
        }
      }
      function booted() {
        return !!document.querySelector('#email, router-outlet, app-splash-screen');
      }
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.querySelector('app-root');
        if (root) {
          var obs = new MutationObserver(function () {
            if (booted()) {
              removeInitSplash();
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true, subtree: true });
        }
        setTimeout(removeInitSplash, 2500);
        setTimeout(function () {
          if (!booted()) {
            var key = 'edysync_boot_retry';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              location.reload();
            }
          }
        }, 8000);
      });
    })();
  </script>
</body>
</html>
