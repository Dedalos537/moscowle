<!-- DCE — Diego Centeno Estuvo Acá -->
@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

    <div class="relative bg-surface rounded-2xl shadow-soft w-full max-w-lg mx-4 z-10 flex flex-col max-h-[90vh] animate-modal-in">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <h3 class="text-xl font-semibold text-textDark m-0">{{ title }}</h3>
        <button class="text-charcoal hover:text-textDark transition-colors p-2 focus:outline-none hover:bg-surface-container-low rounded-lg" (click)="closeModal()">
          <fa-icon [icon]="['fas', 'times']"></fa-icon>
        </button>
      </div>

      <div class="px-6 py-4 overflow-y-auto">
        <ng-content></ng-content>
      </div>

      <div class="px-6 py-4 border-t border-border flex justify-end gap-3 bg-surface-container-low/30 rounded-b-2xl min-h-[1px]">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
