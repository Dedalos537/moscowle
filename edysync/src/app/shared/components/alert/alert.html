@if (message() && visible) {
  <div class="flex items-center gap-3 p-4 border rounded-lg animate-fade-in" [class]="alertClasses">
    <fa-icon [icon]="icon" class="text-lg shrink-0"></fa-icon>
    <span class="text-sm font-medium flex-1">{{ message() }}</span>
    @if (dismissible()) {
      <button type="button" class="shrink-0 flex items-center justify-center w-5 h-5 rounded-full opacity-60 hover:opacity-100 transition-opacity" (click)="dismiss()">
        <fa-icon [icon]="['fas', 'times']" class="text-xs"></fa-icon>
      </button>
    }
  </div>
}
