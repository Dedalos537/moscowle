@if (toasts.length > 0) {
  <div class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
    @for (toast of toasts; track toast.id) {
      <div class="flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg pointer-events-auto animate-slide-up"
           [class]="alertClasses(toast.type)">
        <fa-icon [icon]="icon(toast.type)" class="text-lg shrink-0"></fa-icon>
        <span class="text-sm font-medium flex-1 leading-snug">{{ toast.message }}</span>
        <button type="button" class="shrink-0 flex items-center justify-center w-5 h-5 rounded-full opacity-60 hover:opacity-100 transition-opacity" (click)="dismiss(toast.id)">
          <fa-icon [icon]="['fas', 'times']" class="text-xs"></fa-icon>
        </button>
      </div>
    }
  </div>
}
