<!-- Región viva siempre presente: los lectores de pantalla anuncian cada aviso nuevo. -->
<div class="tc" aria-live="polite" aria-relevant="additions">
  @for (toast of toasts; track toast.id) {
    <div class="tc-toast" [class]="alertClasses(toast.type)" [attr.role]="toast.type === 'error' ? 'alert' : 'status'">
      <fa-icon [icon]="icon(toast.type)" class="tc-icon" aria-hidden="true"></fa-icon>
      <span class="tc-text">{{ toast.message }}</span>
      <button type="button" class="tc-close" (click)="dismiss(toast.id)" aria-label="Cerrar aviso">
        <fa-icon [icon]="['fas', 'xmark']" aria-hidden="true"></fa-icon>
      </button>
    </div>
  }
</div>
