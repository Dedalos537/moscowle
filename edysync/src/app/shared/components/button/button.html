<button
  [type]="type()"
  [class]="btnClass"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)">

  @if (loading()) {
    <span class="btn-spinner"></span>
  }

  @if (icon() && !loading()) {
    <fa-icon [icon]="icon()"></fa-icon>
  }

  @if (label()) {
    <span>{{ label() }}</span>
  }

  <ng-content></ng-content>
</button>
