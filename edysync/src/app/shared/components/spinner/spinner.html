<div class="flex flex-col justify-center items-center p-4" [class.gap-4]="size() === 'lg'">
  @if (size() === 'lg') {
    <app-logo class="w-14 h-14 opacity-70" role="img" aria-label="Centro Juan Pablo II"></app-logo>
  }
  <fa-icon
    [icon]="['fas', 'spinner']"
    animation="spin"
    [class]="colorClass + ' ' + sizeClass">
  </fa-icon>
</div>
