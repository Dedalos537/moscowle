<div class="flex flex-col justify-center items-center p-4" [class.gap-4]="size === 'lg'">
  @if (size === 'lg') {
    <img src="assets/img/logo.svg" alt="Logo" class="w-14 h-14 opacity-70">
  }
  <fa-icon
    [icon]="['fas', 'spinner']"
    animation="spin"
    [class]="colorClass + ' ' + sizeClass">
  </fa-icon>
</div>
