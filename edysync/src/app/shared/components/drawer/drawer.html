@if (isOpen()) {
  <div class="drawer-overlay">
    <div class="drawer-backdrop" aria-hidden="true" (click)="closeDrawer()"></div>

    <div
      class="drawer-panel {{ sizeClass }}"
      [style.max-width]="customWidth"
      appFocusTrap
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="hasCustomHeader || !title() ? null : titleId"
      [attr.aria-label]="hasCustomHeader || !title() ? (title() || 'Panel') : null"
      (keydown.escape)="closeDrawer()"
    >
      <div class="drawer-header">
        @if (hasCustomHeader) {
          <ng-content select="[drawer-header]"></ng-content>
        } @else {
          @if (title()) {
            <h3 class="drawer-title" [id]="titleId">
              @if (icon()) {
                <fa-icon [icon]="icon()!" [class]="iconColor()"></fa-icon>
              }
              {{ title() }}
            </h3>
          }
          <button type="button" class="drawer-close" aria-label="Cerrar" (click)="closeDrawer()">
            <fa-icon [icon]="['fas', 'xmark']" class="drawer-close-icon" aria-hidden="true"></fa-icon>
          </button>
        }
      </div>

      <div class="drawer-body">
        <ng-content></ng-content>
      </div>

      <div class="drawer-footer">
        <ng-content select="[drawer-footer]"></ng-content>
      </div>
    </div>
  </div>
}
