<span [class]="chipClasses">
  <ng-content></ng-content>
  @if (label()) {
    <span>{{ label() }}</span>
  }
  @if (removable()) {
    <button class="ml-0.5 hover:opacity-60 transition-opacity" (click)="$event.stopPropagation()">
      <fa-icon [icon]="['fas', 'times']" class="text-[10px]"></fa-icon>
    </button>
  }
</span>
