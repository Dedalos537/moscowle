@if (active()) {
  <div class="wiz-backdrop" (click)="dismiss()"></div>

  @if (highlightRect(); as hr) {
    <div class="wiz-highlight" [style.top.px]="hr.top" [style.left.px]="hr.left" [style.width.px]="hr.width" [style.height.px]="hr.height"></div>
  }

  @if (currentStep(); as step) {
    <div class="wiz-tooltip" [style.top]="tooltipStyle().top" [style.left]="tooltipStyle().left" [style.transform]="tooltipStyle().transform" (click)="$event.stopPropagation()">
      <div class="wiz-tooltip-header">
        <span class="wiz-step-indicator">{{ currentStepIndex() + 1 }}</span>
        <span class="wiz-tooltip-title">{{ step.title }}</span>
      </div>
      <p class="wiz-tooltip-desc">{{ step.description }}</p>

      <div class="wiz-progress">
        @for (dot of [].constructor(totalSteps()); track $index) {
          <div class="wiz-dot"
            [class.active]="$index === currentStepIndex()"
            [class.done]="$index < currentStepIndex()">
          </div>
        }
      </div>

      <div class="wiz-actions">
        @if (currentStepIndex() > 0) {
          <button class="wiz-btn wiz-btn-ghost" (click)="prev()">
            <fa-icon [icon]="['fas', 'arrow-left']" class="mr-1"></fa-icon>
            Anterior
          </button>
        }
        @if (!isLastStep()) {
          <button class="wiz-btn wiz-btn-primary" (click)="next()">
            Siguiente
            <fa-icon [icon]="['fas', 'arrow-right']" class="ml-1"></fa-icon>
          </button>
        } @else {
          <button class="wiz-btn wiz-btn-primary" (click)="finish()">
            <fa-icon [icon]="['fas', 'check']" class="mr-1"></fa-icon>
            Finalizar
          </button>
        }
      </div>

      <div style="text-align:center;margin-top:12px">
        <button class="wiz-btn wiz-btn-skip" (click)="dismiss()">Saltar tour</button>
      </div>
    </div>
  }
}
