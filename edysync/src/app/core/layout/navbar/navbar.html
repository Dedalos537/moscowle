<header class="bg-surface shadow-soft border-b border-border px-6 py-4 flex justify-between items-center z-10 sticky top-0">
  <div class="flex items-center gap-3">
    <div class="text-2xl text-primary font-bold cursor-pointer" routerLink="/">
      <fa-icon [icon]="['fas', 'leaf']" class="mr-2 text-primary"></fa-icon>
      EdySync
    </div>
  </div>
  
  <div class="flex items-center gap-4">
    <button (click)="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700 transition text-charcoal">
       <fa-icon [icon]="theme === 'light' ? ['fas', 'moon'] : ['fas', 'sun']"></fa-icon>
    </button>

    @if (user$ | async; as user) {
      <div class="flex items-center gap-4 border-l pl-4 border-border">
        <span class="text-sm font-medium text-textDark">{{ user.email }}</span>
        <button (click)="logout()" class="text-sm px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors">
          <fa-icon [icon]="['fas', 'sign-out-alt']" class="mr-1"></fa-icon> Salir
        </button>
      </div>
    } @else {
      <app-button variant="primary" label="Iniciar Sesión" (clicked)="usuarioSeVaALogin()"></app-button>
    }
  </div>
</header>
