@if (routeLoading) {
  <div class="fixed inset-0 z-[60] bg-background/60 backdrop-blur-sm flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <app-spinner size="lg" colorClass="text-primary"></app-spinner>
      @if (loadElapsed) {
        <span class="text-xs text-on-surface-variant font-mono tabular-nums">{{ loadElapsed }}</span>
      }
    </div>
  </div>
}

@if (confirmService.state$ | async; as confirmState) {
  @if (confirmState.visible) {
    <div class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" (click)="confirmService.close(false)">
      <div class="bg-surface rounded-2xl shadow-2xl border border-outline-variant/30 max-w-sm w-full p-6 animate-fade-in" (click)="$event.stopPropagation()">
        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4"
             [class.bg-red-100]="confirmState.options.variant === 'danger'"
             [class.bg-amber-100]="confirmState.options.variant === 'warning'"
             [class.bg-primary/10]="confirmState.options.variant === 'primary'">
          <fa-icon [icon]="$any(confirmState.options.icon || ['fas', 'exclamation-triangle'])"
                   class="text-2xl"
                   [class.text-red-600]="confirmState.options.variant === 'danger'"
                   [class.text-amber-600]="confirmState.options.variant === 'warning'"
                   [class.text-primary]="confirmState.options.variant === 'primary'"></fa-icon>
        </div>
        <h3 class="text-lg font-bold text-on-surface text-center mb-2">{{ confirmState.options.title }}</h3>
        <p class="text-sm text-on-surface-variant text-center mb-6">{{ confirmState.options.message }}</p>
        <div class="flex gap-3">
          <app-button variant="secondary" class="flex-1" [label]="confirmState.options.cancelText || 'Cancelar'" (clicked)="confirmService.close(false)"></app-button>
          <app-button [variant]="confirmState.options.variant === 'primary' ? 'primary' : 'danger'" class="flex-1" [label]="confirmState.options.confirmText || 'Confirmar'" (clicked)="confirmService.close(true)"></app-button>
        </div>
      </div>
    </div>
  }
}

<div class="flex h-screen bg-background text-textDark overflow-hidden transition-colors duration-300">
  <app-sidebar class="flex-shrink-0 z-20"></app-sidebar>
  <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
    <app-header class="z-10"></app-header>
    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar relative">
      <div [@routeAnimations]="prepareRoute()">
        <router-outlet></router-outlet>
      </div>
    </main>
    <app-ai-chat></app-ai-chat>
  </div>
</div>
