@if (routeLoading) {
  <div class="route-loader">
    <div class="route-loader__content">
      <app-spinner size="lg" colorClass="text-primary"></app-spinner>
      @if (loadElapsed) {
        <span class="route-loader__time">{{ loadElapsed }}</span>
      }
    </div>
  </div>
}

@if (confirmService.state$ | async; as confirmState) {
  @if (confirmState.visible) {
    <app-confirm-dialog
      [state]="confirmState"
      (confirm)="confirmService.close(true)"
      (cancel)="confirmService.close(false)"
    ></app-confirm-dialog>
  }
}

<div class="layout">
  <app-sidebar class="layout__sidebar"></app-sidebar>
  <div class="layout__main">
    <app-header class="layout__header"></app-header>
    <main class="layout__content">
      <div [@routeAnimations]="prepareRoute()">
        <router-outlet></router-outlet>
      </div>
    </main>
    <app-ai-chat></app-ai-chat>
    <app-help-panel></app-help-panel>
  </div>
</div>
