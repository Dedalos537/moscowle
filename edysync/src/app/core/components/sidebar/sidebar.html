@if (isOpen) {
  <div class="sidebar-overlay" (click)="sidebarService.close()"></div>
}
<aside
  class="sidebar"
  [class.sidebar--open]="isOpen"
  [class.sidebar--expanded]="expanded"
  aria-label="Navegación principal">

  <!-- Brand / Logo -->
  <div class="sidebar-brand">
    <app-logo class="sidebar-logo-img"></app-logo>
    <span class="sidebar-brand-name">Centro Juan Pablo II</span>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav" #navEl (scroll)="onNavScroll()">
    <span class="nav-indicator" aria-hidden="true"
      [class.is-ready]="indicatorReady" [class.is-snap]="indicatorSnap"
      [style.transform]="'translateY(' + indicator.y + 'px)'" [style.height.px]="indicator.h"></span>

    @for (item of navItems; track item.path; let i = $index) {
      <a
        #navLink
        [routerLink]="item.path"
        routerLinkActive="nav-link--active"
        #rla="routerLinkActive"
        class="nav-link"
        [class.nav-link--active]="rla.isActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        (click)="sidebarService.close()"
        (mouseenter)="onItemHover(i)"
        (mouseleave)="onItemLeave()"
        (focus)="onItemHover(i)"
        (blur)="onItemLeave()"
        [attr.aria-label]="expanded ? null : item.label + (item.subtitle ? ', ' + item.subtitle : '')">
        <fa-icon [icon]="item.icon" class="nav-link-icon" aria-hidden="true"></fa-icon>

        <!-- El texto siempre existe: se muestra/oculta con una transición, sin insertarlo ni quitarlo del DOM -->
        <div class="nav-link-text" [attr.aria-hidden]="!expanded && !isOpen">
          <span class="nav-link-label">{{ item.label }}</span>
          @if (item.subtitle) {
            <span class="nav-link-sub">{{ item.subtitle }}</span>
          }
        </div>
      </a>
    }
  </nav>

  <!-- Pestaña flotante de la barra compacta: una sola, que se desliza entre ítems -->
  <div class="nav-flyout" aria-hidden="true"
    [class.is-visible]="flyVisible && !expanded && !isOpen" [class.is-snap]="flySnap"
    [style.transform]="'translateY(' + flyY + 'px)'" [style.height.px]="flyH">
    <span class="nav-flyout__label">{{ flyItem?.label }}</span>
    @if (flyItem?.subtitle) {
      <span class="nav-flyout__sub">{{ flyItem?.subtitle }}</span>
    }
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button type="button" class="sidebar-help-btn" (click)="toggleHelp()"
      [title]="helpState.panelOpen() ? 'Cerrar ayuda' : 'Ayuda'"
      [attr.aria-label]="helpState.panelOpen() ? 'Cerrar ayuda' : 'Ayuda'">
      <fa-icon [icon]="['fas', helpState.panelOpen() ? 'times' : 'question']"></fa-icon>
    </button>
  </div>
</aside>
