@if (isOpen) {
  <div class="sidebar-overlay" (click)="sidebarService.close()"></div>
}
<aside class="sidebar" [class.sidebar--open]="isOpen">
  <div class="sidebar-brand">
    <div class="sidebar-logo">
      <img src="assets/img/logo.svg" alt="Logo" class="w-10 h-10 object-contain">
      <div>
        <span class="sidebar-brand-name">EdySync</span>
        <span class="sidebar-brand-sub">Centro Juan Pablo II</span>
      </div>
    </div>
  </div>

  <div class="sidebar-section-label">Navegación</div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="nav-link--active"
        #rla="routerLinkActive"
        class="nav-link"
        [class.nav-link--active]="rla.isActive"
        (click)="sidebarService.close()"
      >
        <fa-icon [icon]="item.icon" class="nav-link-icon"></fa-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="relative">
      <button type="button" class="sidebar-help-btn" (click)="toggleHelp()"
        [title]="helpState.panelOpen() ? 'Cerrar ayuda' : 'Ayuda'"
        [attr.aria-label]="helpState.panelOpen() ? 'Cerrar ayuda' : 'Ayuda'">
        <fa-icon [icon]="['fas', helpState.panelOpen() ? 'times' : 'question']"></fa-icon>
      </button>
    </div>
    @if (notifCount > 0) {
      <div class="sidebar-notif-badge">
        <fa-icon [icon]="['fas', 'bell']" class="text-xs"></fa-icon>
        <span>{{ notifCount > 9 ? '9+' : notifCount }}</span>
      </div>
    }
  </div>
</aside>
