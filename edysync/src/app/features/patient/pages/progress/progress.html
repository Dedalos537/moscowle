<div *ngIf="loading" class="flex justify-center items-center h-96">
  <app-spinner size="lg" colorClass="text-primary"></app-spinner>
</div>

<div *ngIf="!loading && data" class="space-y-6" [@fadeInUp]>
  <app-card>
    <p class="text-charcoal text-sm">{{ data.weekly_summary }}</p>
  </app-card>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <app-card title="Precisión (7 días)" [icon]="['fas', 'bullseye']">
      <div class="flex items-end gap-2 h-48">
        <div *ngFor="let val of data.accuracy_data; let i = index" class="flex-1 flex flex-col items-center gap-1">
          <div class="w-full rounded-t-lg transition-all duration-500"
               [style.height.px]="val * 1.8"
               [ngClass]="{
                 'bg-primary': val >= 70,
                 'bg-amber-400': val >= 40 && val < 70,
                 'bg-red-400': val < 40
               }">
          </div>
          <span class="text-[10px] text-charcoal font-medium">{{ val }}%</span>
          <span class="text-[8px] text-charcoal/60" *ngIf="data.labels[i]">{{ data.labels[i] | slice:0:3 }}</span>
        </div>
      </div>
    </app-card>

    <app-card title="Tiempo Promedio (7 días)" [icon]="['fas', 'clock']">
      <div class="flex items-end gap-2 h-48">
        <div *ngFor="let val of data.time_data; let i = index" class="flex-1 flex flex-col items-center gap-1">
          <div class="w-full bg-blue-400 rounded-t-lg transition-all duration-500"
               [style.height.px]="val * 0.8">
          </div>
          <span class="text-[10px] text-charcoal font-medium">{{ val }}s</span>
        </div>
      </div>
    </app-card>
  </div>

  <app-card title="Logros" [icon]="['fas', 'trophy']">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div *ngFor="let achievement of data.achievements"
           class="p-4 rounded-xl text-center transition-all"
           [ngClass]="achievement.achieved ? 'bg-green-50 border border-green-200' : 'bg-gray-50 border border-gray-200 opacity-60'">
        <fa-icon [icon]="achievement.achieved ? ['fas', 'medal'] : ['fas', 'lock']"
                 [ngClass]="achievement.achieved ? 'text-primary' : 'text-gray-300'"
                 class="text-2xl mb-2"></fa-icon>
        <p class="text-xs font-bold text-textDark">{{ achievement.name }}</p>
        <p class="text-[10px] text-charcoal mt-1" *ngIf="achievement.achieved && achievement.date">{{ achievement.date | date:'dd/MM/yyyy' }}</p>
      </div>
    </div>
  </app-card>
</div>
