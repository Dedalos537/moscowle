<div class="max-w-2xl mx-auto space-y-6" [@fadeInUp]>
  @if (message) {
    <div class="p-4 rounded-xl text-sm font-bold"
         [class]="messageType === 'success' ? 'bg-success-container text-success border border-success-container' : 'bg-error-container text-error border border-error-container'">
      {{ message }}
    </div>
  }

  <div class="bg-surface-container-lowest rounded-lg shadow-soft p-6 border border-border/20">
    <h2 class="text-lg font-bold text-on-surface mb-6">Informacion Personal</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Email</label>
        <input [value]="user?.email" disabled
               class="w-full rounded-xl bg-surface-container-low border border-border px-4 py-2.5 text-sm text-on-surface-variant">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Nombre de usuario</label>
        <input [(ngModel)]="username"
               class="w-full rounded-xl border border-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Telefono</label>
        <input [(ngModel)]="phone"
               class="w-full rounded-xl border border-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Zona Horaria</label>
        <select [(ngModel)]="timezone"
                class="w-full rounded-xl border border-border px-4 py-2.5 text-sm bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
          @for (tz of timezones; track tz.value) {
            <option [value]="tz.value">{{ tz.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="bg-surface-container-lowest rounded-lg shadow-soft p-6 border border-border/20">
    <h2 class="text-lg font-bold text-on-surface mb-6">Cambiar Contrasena</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Nueva contrasena</label>
        <input [(ngModel)]="newPassword" type="password"
               class="w-full rounded-xl border border-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1">Confirmar contrasena</label>
        <input [(ngModel)]="confirmPassword" type="password"
               class="w-full rounded-xl border border-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
      </div>
      @if (newPassword && confirmPassword && newPassword !== confirmPassword) {
        <p class="text-xs text-error">
          Las contrasenas no coinciden
        </p>
      }
    </div>
  </div>

  <div class="flex justify-end">
    <button (click)="saveProfile()" [disabled]="saving"
            class="px-6 py-3 bg-primary text-white rounded-xl text-sm font-bold hover:brightness-110 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
      @if (saving) {
        <fa-icon [icon]="['fas', 'spinner']" class="fa-spin"></fa-icon>
      }
      Guardar Cambios
    </button>
  </div>
</div>
