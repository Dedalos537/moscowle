<div class="max-w-2xl mx-auto space-y-6" [@fadeInUp]>
  <div *ngIf="message" class="p-4 rounded-xl text-sm font-bold"
       [ngClass]="messageType === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'">
    {{ message }}
  </div>

  <app-card title="Información Personal">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-charcoal mb-1">Email</label>
        <input [value]="user?.email" disabled
               class="w-full rounded-xl bg-gray-50 border border-border px-4 py-2.5 text-sm text-gray-500">
      </div>
      <app-input id="username" label="Nombre de usuario" [value]="username" (valueChange)="username = $any($event)"></app-input>
      <app-input id="phone" label="Teléfono" [value]="phone" (valueChange)="phone = $any($event)"></app-input>
    </div>
  </app-card>

  <app-card title="Cambiar Contraseña">
    <div class="space-y-4">
      <app-input id="newPassword" label="Nueva contraseña" type="password" [value]="newPassword" (valueChange)="newPassword = $any($event)"></app-input>
      <app-input id="confirmPassword" label="Confirmar contraseña" type="password" [value]="confirmPassword" (valueChange)="confirmPassword = $any($event)"></app-input>
      <p *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" class="text-xs text-red-500">
        Las contraseñas no coinciden
      </p>
    </div>
  </app-card>

  <div class="flex justify-end">
    <app-button [disabled]="saving" (clicked)="saveProfile()">
      <fa-icon *ngIf="saving" [icon]="['fas', 'spinner']" animation="spin" class="mr-1"></fa-icon>
      Guardar Cambios
    </app-button>
  </div>
</div>
