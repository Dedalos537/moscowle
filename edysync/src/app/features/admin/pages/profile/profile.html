<div class="max-w-2xl mx-auto space-y-6 animate-fade-in-up" [@fadeInUp]>
  <div>
    <h2 class="text-xl font-bold text-on-surface flex items-center gap-2">
      <fa-icon [icon]="['fas', 'circle-user']" class="text-primary"></fa-icon> Mi Perfil
    </h2>
    <p class="text-sm text-on-surface-variant">Actualiza tu información personal y contraseña</p>
  </div>

  <div class="bg-surface-container-lowest rounded-lg shadow-soft p-6 border border-border/20 space-y-8">
    <app-avatar-uploader></app-avatar-uploader>
    <app-fingerprint-card></app-fingerprint-card>
  </div>

  <app-card title="Información Personal">
    <div class="space-y-4">
      <app-input id="profile-username" label="Nombre de Usuario" [(value)]="username"></app-input>
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Email</label>
        <p class="px-4 py-3 bg-surface-container-high border border-border/30 rounded-xl text-sm text-on-surface-variant">{{ email }}</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Zona Horaria</label>
        <app-select [(ngModel)]="timezone" [options]="timezones" ariaLabel="Zona horaria"></app-select>
      </div>
    </div>
  </app-card>

  <app-card title="Cambiar Contraseña" subtitle="Deja en blanco para mantener la actual">
    <div class="space-y-4">
      <app-input id="profile-password" label="Nueva Contraseña" [(value)]="newPassword" type="password"></app-input>
      <app-input id="profile-confirm" label="Confirmar Contraseña" [(value)]="confirmPassword" type="password"></app-input>
    </div>
  </app-card>

  @if (statusText) {
    <app-alert [type]="statusType" [message]="statusText"></app-alert>
  }

  <app-button variant="primary" label="Guardar Cambios" [disabled]="saving" (clicked)="saveProfile()"></app-button>
</div>
