<div class="max-w-2xl mx-auto space-y-6 animate-fade-in-up" [@fadeInUp]>
  <div>
    <h2 class="text-xl font-bold text-on-surface flex items-center gap-2">
      <fa-icon [icon]="['fas', 'user-circle']" class="text-primary"></fa-icon> Mi Perfil
    </h2>
    <p class="text-sm text-on-surface-variant">Actualiza tu informacion personal y contrasena</p>
  </div>

  <app-card title="Informacion Personal">
    <div class="space-y-4">
      <app-input id="profile-username" label="Nombre de Usuario" [(value)]="username"></app-input>
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase mb-2">Email</label>
        <p class="px-4 py-3 bg-surface-container-high border border-border/30 rounded-xl text-sm text-on-surface-variant">{{ email }}</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase mb-2">Zona Horaria</label>
        <select [(ngModel)]="timezone"
                class="w-full rounded-xl border border-border px-4 py-3 text-sm bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
          @for (tz of timezones; track tz.value) {
            <option [value]="tz.value">{{ tz.label }}</option>
          }
        </select>
      </div>
    </div>
  </app-card>

  <app-card title="Cambiar Contrasena" subtitle="Deja en blanco para mantener la actual">
    <div class="space-y-4">
      <app-input id="profile-password" label="Nueva Contrasena" [(value)]="newPassword" type="password"></app-input>
      <app-input id="profile-confirm" label="Confirmar Contrasena" [(value)]="confirmPassword" type="password"></app-input>
    </div>
  </app-card>

  @if (statusText) {
    <app-alert [type]="statusType" [message]="statusText"></app-alert>
  }

  <app-button variant="primary" label="Guardar Cambios" [disabled]="saving" (clicked)="saveProfile()"></app-button>
</div>
