<article class="sc" [class.is-selected]="selected()" [class.is-off]="!sede().active">
  <button type="button" class="sc-main" (click)="select.emit(sede())" [disabled]="!sede().active"
    [attr.aria-pressed]="sede().active ? selected() : null"
    [attr.aria-label]="sede().active ? 'Ver el scorecard de ' + sede().name : null">
    <span class="sc-head">
      <span class="sc-icon" aria-hidden="true"><fa-icon [icon]="['fas', 'location-dot']"></fa-icon></span>
      <span class="sc-titles">
        <span class="sc-name">{{ sede().name }}</span>
        <span class="sc-addr">{{ sede().address || 'Sin dirección registrada' }}</span>
      </span>
    </span>

    @if (sede().active) {
      <span class="sc-score" [attr.data-s]="tone()">
        @if (loading()) {
          <span class="sc-skel" aria-hidden="true"></span>
        } @else {
          <span class="sc-score__num">{{ score()?.score ?? '—' }}</span>
          <span class="sc-score__label">{{ score()?.score != null ? 'de 100 en metas' : 'sin metas evaluables' }}</span>
        }
      </span>
      <span class="sc-figs">
        @for (f of figures(); track f.label) {
          <span class="sc-fig">
            <span class="sc-fig__label">{{ f.label }}</span>
            @if (loading()) { <span class="sc-skel sc-skel--sm" aria-hidden="true"></span> }
            @else { <span class="sc-fig__value">{{ f.value }}</span> }
          </span>
        }
      </span>
    } @else {
      <span class="sc-off">Sede inactiva · no aparece en el scorecard ni al asignar pacientes</span>
    }
  </button>

  <div class="sc-actions">
    <button type="button" class="sc-act" (click)="edit.emit(sede())" [attr.aria-label]="'Editar ' + sede().name" title="Editar">
      <fa-icon [icon]="['fas', 'pencil']" aria-hidden="true"></fa-icon>
    </button>
    <button type="button" class="sc-act" (click)="toggle.emit(sede())"
      [attr.aria-label]="(sede().active ? 'Desactivar ' : 'Activar ') + sede().name" [title]="sede().active ? 'Desactivar' : 'Activar'">
      <fa-icon [icon]="sede().active ? ['fas', 'pause'] : ['fas', 'play']" aria-hidden="true"></fa-icon>
    </button>
  </div>
</article>
