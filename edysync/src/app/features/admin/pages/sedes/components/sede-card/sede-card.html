<div class="group bg-surface-container-lowest rounded-xl shadow-soft hover:shadow-soft transition-all border border-border/20 overflow-hidden flex flex-col">

  <div class="p-6 flex-1 flex flex-col cursor-pointer" (click)="edit.emit(sede())">
    <div class="flex items-start justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-primary-container/15 flex items-center justify-center">
          <fa-icon [icon]="['fas', 'home']" class="text-primary text-xl"></fa-icon>
        </div>
        <app-pill-status
          [status]="sede().active ? 'completed' : 'error'"
          [label]="sede().active ? 'Activa' : 'Inactiva'"
        />
      </div>
      <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button (click)="$event.stopPropagation(); toggle.emit(sede())"
          class="w-8 h-8 rounded-full hover:bg-surface-container-high text-on-surface-variant flex items-center justify-center transition-colors cursor-pointer"
          [title]="sede().active ? 'Desactivar' : 'Activar'">
          <fa-icon [icon]="sede().active ? ['fas', 'pause'] : ['fas', 'play']" class="text-sm"></fa-icon>
        </button>
        <button (click)="$event.stopPropagation(); edit.emit(sede())"
          class="w-8 h-8 rounded-full hover:bg-surface-container-high text-on-surface-variant flex items-center justify-center transition-colors cursor-pointer"
          title="Editar">
          <fa-icon [icon]="['fas', 'pencil']" class="text-sm"></fa-icon>
        </button>
      </div>
    </div>

    <h3 class="text-xl font-bold text-on-surface truncate mb-1">{{ sede().name }}</h3>
    <p class="text-sm text-on-surface-variant line-clamp-2">{{ sede().address || 'Sin direccion' }}</p>
  </div>

  <div class="border-t border-border/20 p-6 space-y-4 bg-surface-container-high/30 group-hover:bg-primary/[0.02] transition-colors">

    <div class="flex justify-between items-center text-sm">
      <span class="flex items-center gap-3 text-on-surface-variant font-medium">
        <fa-icon [icon]="['fas', 'users']" class="text-info"></fa-icon> Pacientes
      </span>
      <span class="font-bold text-on-surface">{{ sede().stats?.patients?.total ?? '—' }}</span>
    </div>

    <div class="flex justify-between items-center text-sm">
      <span class="flex items-center gap-3 text-on-surface-variant font-medium">
        <fa-icon [icon]="['fas', 'calendar-alt']" class="text-success"></fa-icon> Sesiones
      </span>
      <span class="font-bold text-on-surface">{{ sede().stats?.sessions?.total_completed ?? '—' }}</span>
    </div>

    <div class="flex justify-between items-center text-sm">
      <span class="flex items-center gap-3 text-on-surface-variant font-medium">
        <fa-icon [icon]="['fas', 'money-bill-wave']" class="text-warning"></fa-icon> Ingresos
      </span>
      <span class="font-bold text-on-surface">S/. {{ sede().stats?.payments?.total_revenue ?? '—' }}</span>
    </div>

  </div>

</div>
