<div class="stats" role="group" aria-label="Resumen de usuarios: pulsa una tarjeta para filtrar el directorio">
  @for (card of cards; track card.key) {
    <button
      type="button"
      class="stat-card"
      [class]="'stat-card stat-card--' + card.tone"
      [attr.aria-pressed]="activeKey() === card.key"
      (click)="selected.emit(card.key)"
    >
      <span class="stat-card__value">{{ card.value(stats()) }}</span>
      <span class="stat-card__label">{{ card.label }}</span>
      <span class="stat-card__hint">{{ card.hint }}</span>
    </button>
  }
</div>

<p class="stats-roles">
  Terapeutas <strong>{{ stats().therapists }}</strong> · Supervisores <strong>{{ stats().supervisors }}</strong> ·
  Administradores <strong>{{ stats().admins }}</strong> · Retirados <strong>{{ stats().retired }}</strong>
</p>
