<div class="min-h-screen flex items-center justify-center bg-background px-4">
  <div class="w-full max-w-md">
    <div class="bg-surface-container-lowest rounded-2xl shadow-soft p-8 border border-border/20">
      <div class="text-center mb-8">
        <img src="assets/img/logo.svg" alt="Logo" class="w-12 h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-on-surface">Recuperar Contraseña</h1>
        <p class="text-sm text-on-surface-variant mt-1">Ingresa tu email para recibir instrucciones</p>
      </div>

      <div *ngIf="step === 'sent'" class="text-center py-6">
        <fa-icon [icon]="['fas', 'check-circle']" class="text-4xl text-green-500 mb-3"></fa-icon>
        <p class="font-semibold text-on-surface">Correo enviado</p>
        <p class="text-sm text-on-surface-variant mt-1">Revisa tu bandeja de entrada para continuar con el cambio de contraseña.</p>
        <button (click)="router.navigate(['/auth/login'])"
                class="mt-6 text-sm font-bold text-primary hover:underline">
          Volver al inicio de sesión
        </button>
      </div>

      <div *ngIf="step === 'request'" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-on-surface-variant mb-1">Email</label>
          <input [(ngModel)]="email" type="email" placeholder="tu@email.com"
                 class="w-full rounded-xl border border-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors">
          <p *ngIf="message" class="text-xs text-red-500 mt-1">{{ message }}</p>
        </div>
        <button (click)="requestReset()" [disabled]="submitting || !email"
                class="w-full py-3 bg-primary text-white rounded-xl font-bold hover:brightness-110 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <fa-icon [icon]="['fas', 'spinner']" *ngIf="submitting" class="fa-spin"></fa-icon>
          Enviar Instrucciones
        </button>
        <a routerLink="/auth/login" class="block text-center text-sm text-on-surface-variant hover:text-primary mt-2">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
