<div class="min-h-screen flex items-center justify-center bg-background px-4">
  <div class="w-full max-w-md">
    <div class="bg-surface-container-lowest rounded-2xl shadow-soft p-8 border border-outline-variant/20">
      <div class="text-center mb-8">
        <img src="assets/img/logo.svg" alt="Logo" class="w-12 h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-textDark">Recuperar Contraseña</h1>
        <p class="text-sm text-charcoal mt-1">Ingresa tu email para recibir instrucciones</p>
      </div>

      <div *ngIf="step === 'sent'" class="text-center py-6">
        <fa-icon [icon]="['fas', 'check-circle']" class="text-4xl text-green-500 mb-3"></fa-icon>
        <p class="font-semibold text-textDark">Correo enviado</p>
        <p class="text-sm text-charcoal mt-1">Revisa tu bandeja de entrada para continuar con el cambio de contraseña.</p>
        <button (click)="router.navigate(['/auth/login'])"
                class="mt-6 text-sm font-bold text-primary hover:underline">
          Volver al inicio de sesión
        </button>
      </div>

      <div *ngIf="step === 'request'" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-charcoal mb-1">Email</label>
          <app-input id="reset-email" type="email" [(value)]="email" placeholder="tu@email.com" [error]="message"></app-input>
        </div>
        <app-button variant="primary" (clicked)="requestReset()" [disabled]="submitting || !email">
          @if (submitting) {
            <fa-icon [icon]="['fas', 'spinner']" animation="spin"></fa-icon>
          }
          Enviar Instrucciones
        </app-button>
        <a routerLink="/auth/login" class="block text-center text-sm text-charcoal hover:text-primary mt-2">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
