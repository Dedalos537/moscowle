<div class="min-h-screen flex items-center justify-center bg-background px-4">
  <div class="w-full max-w-md animate-fade-in-up">
    <div class="bg-surface-container-lowest rounded-xl shadow-soft p-8 border border-border">
      <div class="text-center mb-8">
        <img src="assets/img/logo.svg" alt="Logo" class="w-12 h-12 mx-auto mb-4">
        <h1 class="text-h3 text-on-surface">Recuperar Contraseña</h1>
        <p class="text-body-sm text-on-surface-variant mt-1">Ingresa tu email para recibir instrucciones</p>
      </div>

      @if (step === 'sent') {
        <div class="text-center py-6">
          <fa-icon [icon]="['fas', 'check-circle']" class="text-4xl text-success mb-3"></fa-icon>
          <p class="font-semibold text-on-surface">Correo enviado</p>
          <p class="text-body-sm text-on-surface-variant mt-1">Revisa tu bandeja de entrada para continuar con el cambio de contraseña.</p>
          <button (click)="router.navigate(['/auth/login'])"
                  class="mt-6 text-body-sm font-bold text-primary hover:underline cursor-pointer border-none bg-transparent">
            Volver al inicio de sesión
          </button>
        </div>
      }

      @if (step === 'request') {
        <div class="space-y-4">
          <div>
            <label class="block text-body-sm font-medium text-on-surface-variant mb-1">Email</label>
            <input [(ngModel)]="email" type="email" placeholder="tu@email.com"
                   class="w-full rounded-lg border border-border px-4 py-2.5 text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all bg-surface-container-lowest">
            @if (message) {
              <p class="text-xs text-error mt-1.5">{{ message }}</p>
            }
          </div>
          <button (click)="requestReset()" [disabled]="submitting || !email"
                  class="w-full py-3 bg-primary text-on-primary rounded-lg font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 btn--active cursor-pointer border-none"
                  [ngClass]="submitting ? '' : 'hover:translate-y-[-1px]'">
            @if (submitting) {
              <fa-icon [icon]="['fas', 'spinner']" class="fa-spin"></fa-icon>
            }
            Enviar Instrucciones
          </button>
          <a routerLink="/auth/login" class="block text-center text-body-sm text-on-surface-variant hover:text-primary mt-2 transition-colors">
            Volver al inicio de sesión
          </a>
        </div>
      }
    </div>
  </div>
</div>
