<div class="flex min-h-screen items-center justify-center p-4 bg-[#F8FAFC]">
  <div class="w-full max-w-md bg-white rounded-[32px] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] p-10 relative overflow-hidden">
      
      <!-- Decorational Line top -->
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#86c246] to-[#b7e477]"></div>

      <!-- Logo Section -->
      <div class="text-center mb-8">
          <div class="w-20 h-20 mx-auto mb-4">
              <img src="assets/img/logo.svg" alt="Logo Centro de Terapias" class="w-full h-full object-contain">
          </div>
          <h2 class="text-2xl font-bold text-[#334155] tracking-tight">Centro de Terapias</h2>
          <h3 class="text-lg font-medium text-[#64748b]">Juan Pablo II</h3>
          <p class="text-sm text-[#94a3b8] mt-2">Acceso a Plataforma Digital</p>
      </div>

      <!-- Flash Messages / Alert Component -->
      @if (alertMessage) {
         <div class="mb-6">
            <app-alert [type]="alertType" [message]="alertMessage"></app-alert>
         </div>
      }

      <!-- Login Form -->
      <form (ngSubmit)="doLogin()" class="space-y-6">
          
          <div class="flex flex-col items-center space-y-2">
              <label class="text-sm font-bold text-[#334155]">Correo Electrónico</label>
              <div class="relative w-full">
                  <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#94a3b8] pointer-events-none">
                      <fa-icon [icon]="['fas', 'envelope']" class="text-lg"></fa-icon>
                  </span>
                  <input type="email" id="email" name="email" [(ngModel)]="email"
                      class="w-full pl-12 pr-4 py-3.5 bg-[#f9fafb] border border-transparent rounded-2xl outline-none transition-all text-[#334155] placeholder-[#94a3b8] font-medium focus:border-[#cbd5e1] focus:bg-white" 
                      placeholder="usuario@ejemplo.com" required>
              </div>
          </div>
          
          <div class="flex flex-col items-center space-y-2">
              <label class="text-sm font-bold text-[#334155]">Contraseña</label>
              <div class="relative w-full">
                  <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#94a3b8] pointer-events-none">
                      <fa-icon [icon]="['fas', 'lock']" class="text-lg"></fa-icon>
                  </span>
                  <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                      class="w-full pl-12 pr-12 py-3.5 bg-[#f9fafb] border border-transparent rounded-2xl outline-none transition-all text-[#334155] placeholder-[#94a3b8] font-medium focus:border-[#cbd5e1] focus:bg-white" 
                      placeholder="Ingresa tu contraseña" required>
                  
                  <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#94a3b8] hover:text-[#334155] focus:outline-none transition-colors border-none bg-transparent">
                      <fa-icon [icon]="['fas', showPassword ? 'eye-slash' : 'eye']"></fa-icon>
                  </button>
              </div>
          </div>

          <!-- Options -->
          <div class="flex items-center justify-between pt-2">
              <label class="flex items-center gap-2 cursor-pointer group">
                  <input type="checkbox" class="custom-checkbox">
                  <span class="text-sm font-medium text-[#64748b] group-hover:text-[#334155] transition-colors">Recordarme</span>
              </label>
              <a href="javascript:void(0)" class="text-sm font-bold text-[#75a83a] hover:opacity-80 transition-opacity">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" 
             [disabled]="!isFormValid || isLoading"
             class="w-full py-4 rounded-xl font-bold text-sm uppercase tracking-wide transition-all flex items-center justify-center gap-2"
             [ngClass]="(isFormValid && !isLoading) ? 'bg-[#75a83a] text-white hover:bg-opacity-90 cursor-pointer shadow-lg shadow-[#75a83a]/20' : 'bg-[#e2e8f0] text-[#94a3b8] cursor-not-allowed shadow-none'">
             
             @if (isLoading) {
                 <fa-icon [icon]="['fas', 'spinner']" animation="spin" class="mr-2"></fa-icon>
                 Verificando...
             } @else {
                 <fa-icon [icon]="['fas', 'sign-in-alt']"></fa-icon>
                 INICIAR SESIÓN
             }
          </button>
      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-[#f1f5f9] text-center">
          <p class="text-xs font-medium text-[#94a3b8]">
              ¿Necesitas ayuda? Contacta a <a href="mailto:info@centrojuanpabloii.com" class="text-[#75a83a] font-bold hover:underline">Soporte Técnico</a>
          </p>
      </div>
  </div>
</div>
