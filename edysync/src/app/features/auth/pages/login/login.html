<div class="flex min-h-screen items-center justify-center p-4 bg-background transition-colors duration-300">

  <button (click)="toggleDarkMode()"
    class="fixed top-5 right-5 w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-200 shadow-lg border z-50 cursor-pointer bg-surface-container-lowest text-on-surface-variant border-border hover:bg-surface-container-high"
    [title]="darkMode ? 'Modo Claro' : 'Modo Oscuro'">
    @if (darkMode) {
      <fa-icon [icon]="['fas', 'sun']" class="text-lg text-warning"></fa-icon>
    } @else {
      <fa-icon [icon]="['fas', 'moon']" class="text-lg"></fa-icon>
    }
  </button>

  <div class="w-full max-w-md bg-surface-container-lowest rounded-[32px] shadow-soft p-10 relative overflow-hidden transition-colors duration-300">

      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary-container to-primary-fixed-dim"></div>

      <div class="text-center mb-8">
          <div class="w-20 h-20 mx-auto mb-4">
              <img src="assets/img/logo.svg" alt="Logo Centro de Terapias" class="w-full h-full object-contain">
          </div>
          <h2 class="text-2xl font-bold text-on-surface tracking-tight transition-colors">Centro de Terapias</h2>
          <h3 class="text-lg font-medium text-on-surface-variant transition-colors">Juan Pablo II</h3>
          <p class="text-body-sm text-outline mt-2 transition-colors">Acceso a Plataforma Digital</p>
      </div>

      @if (alertMessage) {
         <div class="mb-6">
            <app-alert [type]="alertType" [message]="alertMessage"></app-alert>
         </div>
      }

      <form (ngSubmit)="doLogin()" class="space-y-5">

          <div>
               <label class="block text-sm font-bold text-on-surface mb-1.5 transition-colors">Correo Electrónico</label>
               <div class="relative w-full">
                   <span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none transition-colors">
                       <fa-icon [icon]="['fas', 'envelope']" class="text-lg"></fa-icon>
                   </span>
                   <input type="email" id="email" name="email" [(ngModel)]="email"
                       class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-border/50 rounded-2xl outline-none transition-all text-on-surface placeholder-outline/50 font-medium focus:border-primary-container focus:bg-surface-container-lowest"
                       placeholder="usuario@ejemplo.com" required>
               </div>
               @if (emailError) {
                 <span class="text-xs text-error mt-1.5 block">{{ emailError }}</span>
               }
           </div>

           <div>
               <label class="block text-sm font-bold text-on-surface mb-1.5 transition-colors">Contraseña</label>
               <div class="relative w-full">
                   <span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none transition-colors">
                       <fa-icon [icon]="['fas', 'lock']" class="text-lg"></fa-icon>
                   </span>
                   <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                       class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low border border-border/50 rounded-2xl outline-none transition-all text-on-surface placeholder-outline/50 font-medium focus:border-primary-container focus:bg-surface-container-lowest"
                       placeholder="Ingresa tu contraseña" required>

                   <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface focus:outline-none transition-colors border-none bg-transparent cursor-pointer">
                      <fa-icon [icon]="['fas', showPassword ? 'eye-slash' : 'eye']"></fa-icon>
                  </button>
              </div>
              @if (passwordError) {
                <span class="text-xs text-error mt-1.5 block">{{ passwordError }}</span>
              }
          </div>

          <div class="flex items-center justify-between pt-2">
               <label class="flex items-center gap-2 cursor-pointer group">
                   <input type="checkbox" class="custom-checkbox">
                   <span class="text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
               </label>
              <a routerLink="/auth/reset-password" class="text-body-sm font-bold text-primary-container hover:opacity-80 transition-opacity">¿Olvidaste tu contraseña?</a>
          </div>

           <button type="submit"
              [disabled]="!isFormValid || isLoading"
              class="w-full py-4 rounded-xl font-bold text-sm uppercase tracking-wide transition-all flex items-center justify-center gap-2"
              [ngClass]="(isFormValid && !isLoading) ? 'bg-primary text-on-primary hover:-translate-y-0.5 cursor-pointer shadow-lg shadow-primary/20' : 'bg-surface-container-high text-on-surface-variant/40 cursor-not-allowed shadow-none'"
              (click)="doLogin()">

              @if (isLoading) {
                  <fa-icon [icon]="['fas', 'spinner']" class="fa-spin"></fa-icon>
                  Verificando...
              } @else {
                  <fa-icon [icon]="['fas', 'sign-in-alt']"></fa-icon>
                  INICIAR SESION
              }
           </button>
      </form>

       <div class="mt-8 pt-6 border-t border-border/50 text-center">
           <p class="text-body-sm text-outline transition-colors">
               ¿Necesitas ayuda? Contacta a <a href="mailto:info@centrojuanpabloii.com" class="text-primary-container font-bold hover:underline">Soporte Técnico</a>
           </p>
       </div>
  </div>
</div>
