<div *ngIf="loading" class="flex justify-center items-center h-96">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
</div>

<div *ngIf="!loading && session" class="space-y-6" [@fadeInUp]>
  <!-- Session Info -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-soft border border-outline-variant/20 p-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <p class="text-xs text-charcoal uppercase tracking-wider font-bold mb-1">Paciente</p>
        <p class="text-textDark font-semibold">{{ session.patient_name || 'N/A' }}</p>
      </div>
      <div>
        <p class="text-xs text-charcoal uppercase tracking-wider font-bold mb-1">Fecha y Hora</p>
        <p class="text-textDark font-semibold">{{ session.start_time | date:'dd/MM/yyyy HH:mm' }}</p>
      </div>
      <div>
        <p class="text-xs text-charcoal uppercase tracking-wider font-bold mb-1">Estado</p>
        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider"
              [ngClass]="{
                'bg-green-100 text-green-700': session.status === 'completed',
                'bg-blue-100 text-blue-700': session.status === 'scheduled',
                'bg-gray-100 text-gray-500': session.status === 'cancelled'
              }">
          {{ session.status }}
        </span>
      </div>
    </div>
    <div *ngIf="session.notes" class="mt-4 pt-4 border-t border-border">
      <p class="text-xs text-charcoal uppercase tracking-wider font-bold mb-2">Notas</p>
      <p class="text-sm text-textDark">{{ session.notes }}</p>
    </div>
  </div>

  <!-- Session Images -->
  <div *ngIf="images.length > 0" class="bg-surface-container-lowest rounded-2xl shadow-soft border border-outline-variant/20 p-6">
    <h3 class="text-lg font-bold text-textDark mb-4">Imágenes de la Sesión</h3>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div *ngFor="let img of images" class="relative group">
        <img [src]="img.image_path" [alt]="img.notes || 'Imagen de sesión'"
             class="w-full h-40 object-cover rounded-xl">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center">
          <a [href]="img.image_path" target="_blank"
             class="px-3 py-1.5 bg-white text-textDark text-xs font-bold rounded-lg">
            <fa-icon [icon]="['fas', 'external-link-alt']" class="mr-1"></fa-icon>
            Ver
          </a>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="images.length === 0" class="bg-surface-container-lowest rounded-2xl shadow-soft border border-outline-variant/20 p-6 text-center">
    <fa-icon [icon]="['fas', 'image']" class="text-3xl text-charcoal/30 mb-2"></fa-icon>
    <p class="text-sm text-charcoal">No hay imágenes asociadas a esta sesión</p>
  </div>
</div>
