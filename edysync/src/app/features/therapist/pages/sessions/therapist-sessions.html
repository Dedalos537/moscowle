<ng-template #headerActions>
  <app-button variant="primary" label="Nueva Sesión" [icon]="['fas', 'plus']" (clicked)="openCreateModal()"></app-button>
</ng-template>

<div class="space-y-6">

  <!-- Stat Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-surface rounded-soft shadow-soft p-4 border border-gray-100">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide">Hoy</div>
      <div class="text-2xl font-bold text-primary mt-1">{{ stats.sessions_today }}</div>
      <div class="text-xs text-gray-400">sesiones programadas</div>
    </div>
    <div class="bg-surface rounded-soft shadow-soft p-4 border border-gray-100">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide">Completadas</div>
      <div class="text-2xl font-bold text-green-600 mt-1">{{ stats.completed_sessions }}</div>
      <div class="text-xs text-gray-400">sesiones realizadas</div>
    </div>
    <div class="bg-surface rounded-soft shadow-soft p-4 border border-gray-100">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide">Pendientes</div>
      <div class="text-2xl font-bold text-amber-600 mt-1">{{ stats.pending_sessions }}</div>
      <div class="text-xs text-gray-400">próximas sesiones</div>
    </div>
    <div class="bg-surface rounded-soft shadow-soft p-4 border border-gray-100">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide">Pacientes</div>
      <div class="text-2xl font-bold text-blue-600 mt-1">{{ stats.active_patients }}</div>
      <div class="text-xs text-gray-400">pacientes activos</div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="bg-surface p-4 md:p-6 rounded-soft shadow-soft border border-gray-100 min-h-[600px]">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>

<!-- Create Session Modal -->
<app-modal [isOpen]="showCreateModal" title="Nueva Sesión" (close)="closeCreateModal()">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Paciente <span class="text-red-500">*</span></label>
      <select [(ngModel)]="createForm.patient_id" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
        <option value="">Seleccionar Paciente...</option>
        @for (p of patients; track p.id) {
          <option [value]="p.id">{{ p.username }}</option>
        }
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
      <input type="text" [(ngModel)]="createForm.title" placeholder="Ej: Terapia de Lenguaje" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
      <input type="date" [(ngModel)]="createForm.date" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Inicio <span class="text-red-500">*</span></label>
        <input type="time" [(ngModel)]="createForm.start_time" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Fin <span class="text-red-500">*</span></label>
        <input type="time" [(ngModel)]="createForm.end_time" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
      <select [(ngModel)]="createForm.status" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
        <option value="scheduled">Programada</option>
        <option value="completed">Completada</option>
        <option value="cancelled">Cancelada</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
      <textarea [(ngModel)]="createForm.notes" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm" rows="2"></textarea>
    </div>
  </div>
  <div modal-footer>
    <app-button variant="ghost" label="Cancelar" (clicked)="closeCreateModal()"></app-button>
    <app-button variant="primary" label="Crear Sesión" [icon]="['fas', 'plus']" [disabled]="submitting" (clicked)="submitCreate()"></app-button>
  </div>
</app-modal>

<!-- Edit Session Modal -->
<app-modal [isOpen]="showEditModal" title="Editar Sesión" (close)="closeEditModal()">
  <div class="space-y-4">
    <div class="bg-blue-50 p-3 rounded text-sm text-blue-700">
      <fa-icon [icon]="['fas', 'info-circle']" class="mr-1"></fa-icon>
      Paciente: {{ editForm.patient }}
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
      <input type="text" [(ngModel)]="editForm.title" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
      <input type="date" [(ngModel)]="editForm.date" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Inicio</label>
        <input type="time" [(ngModel)]="editForm.start_time" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Fin</label>
        <input type="time" [(ngModel)]="editForm.end_time" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
      <select [(ngModel)]="editForm.status" class="w-full rounded-lg border-gray-300 focus:ring-primary focus:border-primary text-sm">
        <option value="scheduled">Programada</option>
        <option value="completed">Completada</option>
        <option value="cancelled">Cancelada</option>
      </select>
    </div>
  </div>
  <div modal-footer>
    <app-button variant="danger" label="Eliminar" [icon]="['fas', 'trash-alt']" (clicked)="deleteSession()"></app-button>
    <div class="flex gap-3">
      <app-button variant="ghost" label="Cancelar" (clicked)="closeEditModal()"></app-button>
      <app-button variant="primary" label="Guardar Cambios" [disabled]="submitting" (clicked)="submitEdit()"></app-button>
    </div>
  </div>
</app-modal>
