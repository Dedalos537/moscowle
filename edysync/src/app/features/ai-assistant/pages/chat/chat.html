<div class="flex flex-col h-[calc(100vh-12rem)] bg-surface-container-lowest rounded-2xl shadow-soft border border-outline-variant/20 overflow-hidden">
  <!-- Chat Header -->
  <div class="p-4 border-b border-border bg-primary/5">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
        <fa-icon [icon]="['fas', 'robot']" class="text-primary"></fa-icon>
      </div>
      <div>
        <p class="font-bold text-textDark">Asistente IA EduSync</p>
        <p class="text-xs text-charcoal">Copiloto inteligente para gestión terapéutica</p>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div #chatContainer class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngIf="messages.length === 0" class="text-center py-12">
      <fa-icon [icon]="['fas', 'comment-dots']" class="text-4xl text-charcoal/20 mb-3"></fa-icon>
      <p class="text-sm text-charcoal">Pregúntame sobre:</p>
      <div class="flex flex-wrap justify-center gap-2 mt-4">
        <span class="px-3 py-1.5 bg-surface-container-low rounded-full text-xs text-charcoal">Registrar pagos</span>
        <span class="px-3 py-1.5 bg-surface-container-low rounded-full text-xs text-charcoal">Reportes de sesiones</span>
        <span class="px-3 py-1.5 bg-surface-container-low rounded-full text-xs text-charcoal">Análisis de deudores</span>
        <span class="px-3 py-1.5 bg-surface-container-low rounded-full text-xs text-charcoal">Optimizar agenda</span>
      </div>
    </div>

    <div *ngFor="let msg of messages" class="flex" [ngClass]="{'justify-end': msg.role === 'user', 'justify-start': msg.role === 'assistant'}">
      <div class="max-w-[75%] p-3 rounded-2xl text-sm"
           [ngClass]="msg.role === 'user' ? 'bg-primary text-white rounded-br-sm' : 'bg-surface-container-low text-textDark rounded-bl-sm'">
        <p class="whitespace-pre-wrap">{{ msg.content }}</p>
        <p class="text-[10px] mt-1 opacity-60">{{ msg.timestamp | date:'HH:mm' }}</p>
      </div>
    </div>

    <div *ngIf="loading" class="flex justify-start">
      <div class="bg-surface-container-low rounded-2xl rounded-bl-sm p-4">
        <div class="flex gap-1">
          <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0ms"></div>
          <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 150ms"></div>
          <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 300ms"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="p-4 border-t border-border">
    <div class="flex gap-3">
      <input [(ngModel)]="input" placeholder="Escribe tu consulta aquí..."
             class="flex-1 rounded-xl border border-border px-4 py-3 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none"
             (keyup.enter)="sendMessage()" [disabled]="loading">
      <button (click)="sendMessage()" [disabled]="!input.trim() || loading"
              class="px-5 py-3 bg-primary text-white rounded-xl hover:bg-primary-fixed-dim transition-colors disabled:opacity-50">
        <fa-icon [icon]="['fas', 'paper-plane']"></fa-icon>
      </button>
    </div>
  </div>
</div>
