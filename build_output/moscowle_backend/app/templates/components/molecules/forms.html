{% import 'components/atoms/inputs.html' as inputs %}

{% macro filter_select(id, default_option="Todas las opciones", options=[], placeholder_icon="fas fa-chevron-down") %}
<div class="relative w-full md:w-48">
    <select id="{{ id }}" class="w-full pl-4 pr-10 py-2 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 appearance-none bg-gray-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-900 text-gray-700 dark:text-gray-300 transition-all shadow-sm">
        <option value="all">{{ default_option }}</option>
        {% for opt in options %}
        <option value="{{ opt.value }}">{{ opt.label }}</option>
        {% endfor %}
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
        <i class="{{ placeholder_icon }} text-xs"></i>
    </div>
</div>
{% endmacro %}

{% macro search_input(id, placeholder="Buscar...", icon="fas fa-search") %}
<div class="relative w-full md:w-64">
    <input type="text" id="{{ id }}" placeholder="{{ placeholder }}" class="w-full pl-10 pr-4 py-2 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-900 text-gray-700 dark:text-gray-300 shadow-sm">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <i class="{{ icon }} text-gray-400 text-sm"></i>
    </div>
</div>
{% endmacro %}
