<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JClic Launcher</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#111; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  #chrome { position:fixed; top:0; left:0; right:0; height:44px; z-index:50; background:#0f172a; color:#fff;
            display:flex; align-items:center; justify-content:space-between; padding:0 16px; box-sizing:border-box; }
  #chrome .title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #chrome button { background:#22c55e; color:#fff; border:0; padding:7px 16px; border-radius:8px; font-weight:600;
                   cursor:pointer; font-size:13px; }
  #chrome button:hover { background:#16a34a; }
  #stage { position:absolute; top:44px; left:0; right:0; bottom:0; }
  #stage .JClic { width:100%; height:100%; }
  #status { position:fixed; bottom:10px; right:12px; z-index:60; background:rgba(15,23,42,.85); color:#cbd5e1;
            padding:6px 12px; border-radius:8px; font-size:12px; display:none; }
</style>
</head>
<body>
<div id="chrome">
  <div class="title" id="game-title">Actividad JClic</div>
  <button id="terminate">Terminar</button>
</div>
<div id="stage"><div id="jc" class="JClic"></div></div>
<div id="status">Guardando resultados…</div>

<script>
  window.JClicDataOptions = { noInit: true };
  window.__jclicParams = (function () {
    var q = new URLSearchParams(location.search);
    return { game: q.get('game') || '', title: q.get('title') || '' };
  })();
</script>
<script src="/static/games/vendor/moscowle-bridge.js"></script>
<script type="module" src="/static/games/vendor/jclic/jclic.min.js"></script>
<script>
(function () {
  var P = window.__jclicParams;
  var title = P.title || P.game.replace(/(\/project)?\.jclic(\.zip)?$/i, '').replace(/^clic3\//, '').replace(/_/g, ' ');
  document.getElementById('game-title').textContent = title || 'Actividad';
  window.MoscowleGame.start(title || P.game);
  var player = null;

  // Resultado del informe de JClic: puntuación, actividades resueltas y tiempo medio por actividad.
  function result() {
    var d = null;
    try { d = player && player.reporter ? player.reporter.getData() : null; } catch (e) { d = null; }
    if (!d) return { accuracy: 0, avg_time: 0, kpis: {} };
    var done = d.activitiesDone || 0;
    var total = (d.numActivities || d.activities || 0) || done;
    return {
      accuracy: Math.max(0, Math.min(100, Math.round((d.partialScore != null ? d.partialScore : d.globalScore) || 0))),
      avg_time: done ? Math.round(((d.time || 0) / done) * 10) / 10 : 0,
      level_reached: d.activitiesSolved || 0,
      score: d.globalScore != null ? Math.round(d.globalScore) : null,
      kpis: { completion: total ? Math.round(((d.activitiesSolved || 0) / total) * 100) : 0 },
    };
  }

  function showStatus(msg) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function boot() {
    var JClicObject = window.JClicObject;
    if (!JClicObject || !JClicObject.loadProject) { setTimeout(boot, 60); return; }
    try {
      JClicObject.loadProject(
        document.getElementById('jc'),
        '/static/games/' + P.game,
        { reporter: 'SessionStorageReporter', lang: 'es', fade: 0, audioEnabled: true }
      );
      player = window.JClicObject.currentPlayers && window.JClicObject.currentPlayers[0];
    } catch (e) {
      showStatus('No se pudo cargar la actividad.');
    }
  }
  boot();

  document.getElementById('terminate').addEventListener('click', function () {
    var btn = document.getElementById('terminate');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    window.MoscowleGame.finish(result()).then(function () {
      window.MoscowleGame.exit();
      if (!window.MoscowleGame.embedded) setTimeout(function () { window.close(); }, 400);
    });
  });

  // Si cierran la pestaña sin «Terminar», el avance igual se guarda (una sola vez).
  window.addEventListener('pagehide', function () { window.MoscowleGame.finish(result()); });
})();
</script>
</body>
</html>
