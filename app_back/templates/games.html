{% extends "base.html" %}

{% block content %}
<div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-soft shadow-soft p-8 text-center">
        <h2 class="text-2xl font-bold text-textDark mb-2">Reflejos Rápidos</h2>
        <p class="text-gray-500 mb-6">Haz clic en el círculo rojo tan rápido como puedas.</p>
        
        <div class="flex justify-between items-center mb-4 px-4 py-2 bg-gray-50 rounded-xl">
            <span class="font-medium text-gray-700">Tiempo: <b id="time-display" class="text-primary">0</b> ms</span>
            <span class="font-medium text-gray-700">Aciertos: <b id="score-display" class="text-primary">0</b>/5</span>
        </div>

        <div id="game-area" class="relative w-full h-80 bg-gray-100 rounded-xl border border-gray-200 overflow-hidden cursor-crosshair">
            <div id="target" class="absolute w-8 h-8 bg-red-500 rounded-full cursor-pointer hidden transform active:scale-95 transition-transform"></div>
        </div>

        <button id="start-btn" class="mt-6 w-full py-3 bg-primary text-white font-bold rounded-xl shadow-lg shadow-olive/20 hover:bg-olive transition-all transform hover:-translate-y-0.5">
            Comenzar Juego
        </button>

        <div id="result-box" class="hidden mt-6 p-6 border-2 border-primary/20 rounded-xl bg-green-50/50">
            <h3 class="text-xl font-bold text-textDark mb-2">Resultados de Sesión</h3>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="p-3 bg-white rounded-lg shadow-sm">
                    <p class="text-xs text-gray-500 uppercase">Precisión</p>
                    <p class="text-lg font-bold text-primary"><span id="final-acc"></span></p>
                </div>
                <div class="p-3 bg-white rounded-lg shadow-sm">
                    <p class="text-xs text-gray-500 uppercase">Tiempo Prom.</p>
                    <p class="text-lg font-bold text-primary"><span id="final-time"></span> ms</p>
                </div>
            </div>
            
            <div class="border-t border-gray-200 my-4 pt-4">
                <h4 class="text-sm font-bold text-gray-500 uppercase mb-2">Recomendación IA</h4>
                <div id="ai-recommendation" class="text-lg font-bold text-charcoal mb-4 bg-white p-3 rounded-lg border border-gray-100 shadow-sm animate-pulse">...</div>
                
                <a href="{{url_for('main.dashboard')}}" class="inline-block px-6 py-2 bg-gray-200 text-gray-600 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
                    Volver al Panel
                </a>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='games.js') }}"></script>
{% endblock %}
