{% macro table_header(columns=[]) %}
<thead class="bg-gray-50 dark:bg-slate-800">
  <tr>
    {% for col in columns %}
    <th class="px-6 py-4 {{ col.align|default('text-left') }} text-xs font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider">{{ col.label }}</th>
    {% endfor %}
  </tr>
</thead>
{% endmacro %}

{% macro empty_state(col_count, title="No hay datos disponibles", description="", icon="fas fa-inbox") %}
<tr class="empty-state-row">
    <td colspan="{{ col_count }}" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
        <div class="flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-gray-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 text-2xl text-gray-400">
                <i class="{{ icon }}"></i>
            </div>
            <h4 class="text-lg font-bold text-gray-700 dark:text-gray-300">{{ title }}</h4>
            {% if description %}
            <p class="text-sm mt-1 max-w-sm mx-auto">{{ description }}</p>
            {% endif %}
        </div>
    </td>
</tr>
{% endmacro %}
