{% macro stat_card(id, title, initial_value="0", subtext="", bg_color_class="bg-primary/5", text_color_class="text-charcoal dark:text-white") %}
<div class="stat-card bg-white dark:bg-slate-900 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm hover:shadow-md transition-all duration-300 p-6 flex flex-col justify-center relative overflow-hidden group">
    <div class="absolute right-0 top-0 w-24 h-24 {{ bg_color_class }} rounded-bl-full z-0 group-hover:scale-110 transition-transform"></div>
    <div class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-1 z-10">{{ title }}</div>
    <div id="{{ id }}" class="text-3xl font-extrabold {{ text_color_class }} z-10">{{ initial_value }}</div>
    {% if subtext %}
    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 font-medium z-10">{{ subtext }}</p>
    {% endif %}
</div>
{% endmacro %}
