groups:
  - name: rate_limit_alerts
    rules:
      - alert: HighRateLimitTotal
        expr: sum(rate(app_rate_limited_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High total rate-limited events"
          description: "The application is observing more than 10 rate-limited events per 5m (current value: {{ $value }})."

      - alert: HighRateLimitByEndpoint
        expr: max by (endpoint) (rate(app_rate_limited_total[5m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High rate-limited rate on an endpoint"
          description: "An endpoint is observing a high rate of rate-limited events (>5 per 5m). Endpoint: {{ $labels.endpoint }} Current: {{ $value }}"
