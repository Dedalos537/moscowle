version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: moscowle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Rucula_530
      MYSQL_DATABASE: Moscowle_Complete
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_init:
    build:
      context: ./backend_messaging
      dockerfile: Dockerfile
    container_name: moscowle_db_init
    restart: 'no'
    env_file:
      - ./backend_messaging/.env
    environment:
      DB_HOST: moscowle_db
      DB_USER: root
      DB_PASSWORD: Rucula_530
      DB_NAME: Moscowle_Complete
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "init_db.py"]

  backend:
    build:
      context: ./backend_messaging
      dockerfile: Dockerfile
    container_name: moscowle_backend
    restart: unless-stopped
    env_file:
      - ./backend_messaging/.env
    environment:
      DB_HOST: moscowle_db
      DATABASE_URL: mysql+pymysql://root:Rucula_530@moscowle_db/Moscowle_Complete
    depends_on:
      db_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./backend_messaging:/app

  frontend:
    build:
      context: ./Principal_Page
      dockerfile: Dockerfile
    container_name: moscowle_frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

  dashboard:
    build:
      context: "./Dashboard Administrativo Integral"
      dockerfile: Dockerfile
    container_name: moscowle_dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  db_data:
