version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: moscowle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Rucula_530
      MYSQL_DATABASE: moscowle
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moscowle_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: moscowle_db
      DATABASE_URL: mysql+pymysql://root:Rucula_530@moscowle_db/moscowle
      FLASK_APP: wsgi:app
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:5000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./Principal_Page
      dockerfile: Dockerfile
    container_name: moscowle_frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

  dashboard:
    build:
      context: "./Dashboard Administrativo Integral"
      dockerfile: Dockerfile
    container_name: moscowle_dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  db_data:
