<div class="container-fluid d-none d-lg-block">
  <div class="row align-items-center py-4 px-xl-5">
    <div class="col-lg-3">
      <a routerLink="home" class="text-decoration-none">
        <h1 class="m-0">
          <span class="text-primary">CENTRO DE TERAPIAS</span> JUAN PABLO II
        </h1>
      </a>
    </div>
    <div class="col-lg-7 text-right">
      <div class="d-inline-flex align-items-center">
        <i class="fa fa-2x fa-envelope text-primary mr-3"></i>
        <div class="text-left">
          <h3 class="font-weight-semi-bold mb-1">Escríbenos</h3>
          <h6>{{correo}}</h6>
        </div>
      </div>
    </div>
    <div class="col-lg-2 text-right">
      <button *ngIf="isAuthenticated; else loginButton" class="btn btn-danger px-4 py-2 font-weight-bold"
        (click)="logout()">
        <i class="fa fa-sign-out-alt mr-2"></i>Cerrar Sesión
      </button><ng-template #loginButton><button class="btn btn-primary px-4 py-2 font-weight-bold" routerLink="login">
          <i class="fa fa-user mr-2"></i>Ingresar
        </button>
      </ng-template>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row border-top px-xl-5">
      <div class="col-lg-3 d-none d-lg-block">
        <a class="d-flex align-items-center justify-content-between bg-secondary w-100 text-decoration-none"
          data-toggle="collapse" href="#navbar-vertical" style="height: 67px; padding: 0 30px;">
          <h5 class="text-primary m-0">
            <i class="fa fa-book-open mr-2"></i>Servicios
          </h5>
          <i class="fa fa-angle-down text-primary"></i>
        </a>

        <nav
          class="collapse position-absolute navbar navbar-vertical navbar-light align-items-start p-0 border border-top-0 border-bottom-0 bg-light"
          id="navbar-vertical" style="width: calc(100% - 30px); z-index: 9;">
          <div class="navbar-nav w-100">
            <!-- Repite para cada categoría -->
            <div class="nav-item dropdown" *ngFor="let category of categories">
              <a href="#" class="nav-link" data-toggle="dropdown">{{ category.name }}
                <i class="fa fa-angle-down float-right mt-1"></i>
              </a>
              <div class="dropdown-menu position-absolute bg-secondary border-0 rounded-0 w-100 m-0">
                <a *ngFor="let item of category.items" routerLink="services" class="dropdown-item">
                  {{ item }}
                </a>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <div class="col-lg-9">
        <nav class="navbar navbar-expand-lg bg-light navbar-light py-3 py-lg-0 px-0">
          <a href="#" class="text-decoration-none d-block d-lg-none">
            <h1 class="m-0"><span class="text-primary">CENTRO</span> JUAN PABLO II</h1>
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
            <div class="navbar-nav py-0">
              <a class="nav-item nav-link" routerLink="home" routerLinkActive="active">Inicio</a>
              <a class="nav-item nav-link" routerLink="about" routerLinkActive="active">Acerca</a>
              <a class="nav-item nav-link" routerLink="services" routerLinkActive="active">Servicios</a>
              <a class="nav-item nav-link" routerLink="contact" routerLinkActive="active">Contáctanos</a>
              <a *ngIf="isAdmin()" class="nav-item nav-link" routerLink="dashboard" routerLinkActive="active">Dashboard</a>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Mobile Navbar -->
<div class="d-lg-none pb-2">
  <div class="row align-items-center py-4 px-xl-5">
    <div class="col-12 text-center">
      <h1 class="m-0"><span class="text-primary">CENTRO DE TERAPIAS</span> JUAN PABLO II</h1>
      <div class="mt-4">
        <div class="d-inline-flex align-items-center mt-2">
          <i class="fa fa-envelope text-primary mr-2 fa-lg"></i>
          <div class="text-left">
            <h6 class="m-0">{{correo}}</h6>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary px-4 py-2" routerLink="login">
            <i class="fa fa-user mr-2"></i>Ingresar</button><button *ngIf="isAuthenticated"
            class="btn btn-danger px-4 py-2" (click)="logout()">
            <i class="fa fa-sign-out-alt mr-2"></i>Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>

  <button class="navbar-toggler"
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Abrir menú de navegación"
        aria-controls="mobileNavbar"
        [attr.aria-expanded]="isMobileMenuOpen"
        style="width: 70px; height: 56px; font-size: 2 rem; border-radius: 60%; background: #fff; border: 10px solid #fff;">
    <i class="fa fa-bars fa-lg text-primary"></i>
  </button>

  <div [class.show]="isMobileMenuOpen" class="collapse" id="mobileNavbar" role="navigation" aria-label="Menú principal">
    <div class="bg-light p-3" style="border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);">
      <a class="nav-link py-3 my-1 font-weight-bold" routerLink="home" routerLinkActive="active" style="font-size: 1.3rem; color: #4cb176;">
        <i class="fa fa-home mr-2"></i>Inicio
      </a>
      <a class="nav-link py-3 my-1 font-weight-bold" routerLink="about" routerLinkActive="active" style="font-size: 1.3rem; color: #4cb176;">
        <i class="fa fa-info-circle mr-2"></i>Acerca
      </a>
      <a class="nav-link py-3 my-1 font-weight-bold" routerLink="services" routerLinkActive="active" style="font-size: 1.3rem; color: #4cb176;">
        <i class="fa fa-cogs mr-2"></i>Servicios
      </a>
      <a class="nav-link py-3 my-1 font-weight-bold" routerLink="contact" routerLinkActive="active" style="font-size: 1.3rem; color: #4cb176;">
        <i class="fa fa-envelope mr-2"></i>Contáctanos
      </a>
      <a *ngIf="isAdmin" class="nav-link py-3 my-1 font-weight-bold" routerLink="dashboard" routerLinkActive="active" style="font-size: 1.3rem; color: #4cb176;">
        <i class="fa fa-tachometer-alt mr-2"></i>Dashboard
      </a>
      <div class="border-top pt-3 mt-2">
        <button class="btn btn-primary btn-block py-3 font-weight-bold" routerLink="login" style="font-size: 1.2rem;">
          <i class="fa fa-user mr-2"></i>Ingresar
        </button>
      </div>
    </div>
  </div>
</div>
