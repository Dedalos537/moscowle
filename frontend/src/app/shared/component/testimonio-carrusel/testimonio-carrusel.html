<div class="carousel-container">
  <div class="owl-carousel">
    <div *ngFor="let testimonial of testimonials" class="item">
      <div class="testimonial-item text-center">
        <i class="fa fa-3x fa-quote-left text-primary mb-4"></i>
        <h4 class="font-weight-normal mb-4">{{testimonial.quote}}</h4>
        <img class="img-fluid mx-auto mb-3" style="width: 150px;" [src]="testimonial.img" alt="{{testimonial.name}}">
        <h5 class="m-0">{{testimonial.name}}</h5>
        <span>{{testimonial.profession}}</span>
      </div>
    </div>
  </div>
</div>
