<div
  class="service-card"

  [ngClass]="{'hovered': hover}"
  [style.borderRadius]="'20px'"
  [style.overflow]="'hidden'"
  [style.background]="'white'"
  [style.boxShadow]="hover ? '0 25px 50px rgba(0,0,0,0.2)' : '0 10px 30px rgba(0,0,0,0.1)'"
  [style.cursor]="'pointer'"
  [style.transition]="'all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)'"
  [style.position]="'relative'"
>
  <div
    class="card-image-container"
    [style.height]="'200px'"
    [style.position]="'relative'"
    [style.overflow]="'hidden'"
    [style.background]="'linear-gradient(135deg, ' + colors.primary + ', ' + colors.secondary + ')'"
  >
    <img
      [src]="service.image"
      [alt]="service.title"
      [style.width.%]="100"
      [style.height.%]="100"
      [style.objectFit]="'cover'"
      [style.transition]="'transform 0.4s ease'"
      [style.opacity]="0.9"
      [style.transform]="hover ? 'scale(1.1)' : 'scale(1)'"
      (error)="hideImage($event)"
    />
    <div
      class="overlay"
      [style.position]="'absolute'"
      [style.top.px]="0"
      [style.left.px]="0"
      [style.right.px]="0"
      [style.bottom.px]="0"
      [style.background]="'linear-gradient(135deg, ' + colors.primary + 'dd, ' + colors.secondary + 'dd)'"
      [style.display]="'flex'"
      [style.alignItems]="'center'"
      [style.justifyContent]="'center'"
      [style.opacity]="hover ? 1 : 0"
      [style.transition]="'opacity 0.3s ease'"
    >
      <div [style.fontSize]="'3rem'">{{ service.icon }}</div>
    </div>

    <div
      class="icon-badge"
      [style.position]="'absolute'"
      [style.top.px]="15"
      [style.right.px]="15"
      [style.background]="'rgba(255,255,255,0.9)'"
      [style.borderRadius]="'50%'"
      [style.width.px]="50"
      [style.height.px]="50"
      [style.display]="'flex'"
      [style.alignItems]="'center'"
      [style.justifyContent]="'center'"
      [style.fontSize]="'1.5rem'"
      [style.boxShadow]="'0 4px 12px rgba(0,0,0,0.15)'"
    >
      {{ service.icon }}
    </div>
  </div>

  <div
    class="card-body"
    [style.padding]="'25px 20px'"
    [style.display]="'flex'"
    [style.flexDirection]="'column'"
    [style.minHeight.px]="180"
  >
    <h5
      [style.color]="colors.primary"
      [style.fontWeight]="'700'"
      [style.fontSize]="'1.1rem'"
      [style.textAlign]="'center'"
      [style.marginBottom.px]="15"
      [style.lineHeight]="'1.3'"
      [style.textTransform]="'uppercase'"
      [style.letterSpacing]="'0.5px'"
    >
      {{ service.title }}
    </h5>

    <p
      [style.color]="'#6c757d'"
      [style.fontSize]="'0.9rem'"
      [style.lineHeight]="'1.6'"
      [style.flexGrow]="1"
      [style.marginBottom.px]="20"
      [style.textAlign]="'justify'"
    >
      {{ service.description.length > 120 ? (service.description | slice:0:120) + '...' : service.description }}
    </p>

    <div [style.textAlign]="'center'">
      <button
        (click)="verDetalle()"
        [style.background]="'linear-gradient(135deg, ' + colors.primary + ', ' + colors.secondary + ')'"
        [style.color]="'white'"
        [style.border]="'none'"
        [style.borderRadius]="'25px'"
        [style.padding]="'10px 25px'"
        [style.fontSize]="'0.85rem'"
        [style.fontWeight]="'600'"
        [style.textTransform]="'uppercase'"
        [style.letterSpacing]="'0.5px'"
        [style.transition]="'all 0.3s ease'"
        [style.cursor]="'pointer'"
      >
        Ver detalles
      </button>
    </div>
  </div>
</div>
