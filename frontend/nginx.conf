server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;

  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
    try_files $uri =404;
    expires max;
    log_not_found off;
  }

  error_page 404 /index.html;
}